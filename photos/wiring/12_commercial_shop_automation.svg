<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <rect width="900" height="580" fill="#0b1120" rx="12"/>
  <text x="450" y="38" fill="#38bdf8" font-size="20" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">COMMERCIAL SHOP &amp; RETAIL AUTOMATION SCHEMATIC</text>
  <text x="450" y="62" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif" text-anchor="middle">Glow-Sign Contactor + Cold-Chain Freezer Temp Logger + Shutter Intrusion Alarm</text>

  <!-- High Power Contactor Zone (Left) -->
  <rect x="40" y="90" width="240" height="430" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="160" y="120" fill="#fbbf24" font-size="15" font-weight="bold" text-anchor="middle">230V MAINS &amp; SIGNBOARD</text>

  <rect x="60" y="150" width="200" height="90" fill="#334155" stroke="#f59e0b" rx="6"/>
  <text x="160" y="180" fill="#fef08a" font-size="12" font-weight="bold" text-anchor="middle">25A Modular AC Contactor</text>
  <text x="160" y="200" fill="#cbd5e1" font-size="10" text-anchor="middle">Switches Heavy Facade Glow-Sign</text>
  <text x="160" y="220" fill="#fcd34d" font-size="10" text-anchor="middle">Twilight / Timer Controlled</text>

  <rect x="60" y="260" width="200" height="90" fill="#334155" stroke="#38bdf8" rx="6"/>
  <text x="160" y="290" fill="#bae6fd" font-size="12" font-weight="bold" text-anchor="middle">32A AC Interlock Contactor</text>
  <text x="160" y="310" fill="#cbd5e1" font-size="10" text-anchor="middle">Heavy 2.0 Ton Store AC</text>
  <text x="160" y="330" fill="#93c5fd" font-size="10" text-anchor="middle">Auto-off during generator backup</text>

  <circle cx="160" cy="420" r="35" fill="#ca8a04"/>
  <text x="160" y="425" fill="#000" font-size="10" font-weight="bold" text-anchor="middle">GLOW SIGN</text>
  <text x="160" y="480" fill="#fef08a" font-size="11" text-anchor="middle">Store Front Facade Board</text>

  <!-- Central ESP32 Controller Box -->
  <rect x="330" y="90" width="240" height="430" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" rx="8"/>
  <text x="450" y="120" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">ESP32 SHOP CONTROLLER</text>
  
  <text x="345" y="180" fill="#fbbf24" font-size="11">GPIO19 (Signboard Coil)</text>
  <text x="345" y="280" fill="#38bdf8" font-size="11">GPIO18 (Store AC Coil)</text>
  <text x="515" y="180" fill="#34d399" font-size="11" text-anchor="end">GPIO4 (DS18B20 Temp)</text>
  <text x="515" y="240" fill="#f87171" font-size="11" text-anchor="end">GPIO14 (Shutter Reed)</text>
  <text x="515" y="300" fill="#c084fc" font-size="11" text-anchor="end">GPIO13 (Footfall Beam)</text>
  <text x="515" y="360" fill="#ef4444" font-size="11" text-anchor="end">GPIO23 (Alarm Siren)</text>
  <text x="515" y="420" fill="#cbd5e1" font-size="11" text-anchor="end">GND (Common)</text>

  <line x1="260" y1="180" x2="330" y2="180" stroke="#f59e0b" stroke-width="3"/>
  <line x1="260" y1="280" x2="330" y2="280" stroke="#38bdf8" stroke-width="3"/>

  <!-- Sensors & Security Zone (Right) -->
  <rect x="620" y="90" width="240" height="430" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="740" y="120" fill="#34d399" font-size="15" font-weight="bold" text-anchor="middle">COLD-CHAIN &amp; SECURITY</text>

  <rect x="640" y="150" width="200" height="70" fill="#334155" stroke="#34d399" rx="5"/>
  <text x="740" y="175" fill="#86efac" font-size="11" font-weight="bold" text-anchor="middle">DS18B20 Deep Freezer</text>
  <text x="740" y="195" fill="#cbd5e1" font-size="9" text-anchor="middle">Ice cream / Vaccine Temp (-18°C)</text>
  <text x="740" y="210" fill="#fca5a5" font-size="9" font-weight="bold" text-anchor="middle">Alert if > -12°C or Power Cut</text>

  <rect x="640" y="230" width="200" height="65" fill="#334155" stroke="#f87171" rx="5"/>
  <text x="740" y="255" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">Armored Shutter Contact</text>
  <text x="740" y="275" fill="#cbd5e1" font-size="9" text-anchor="middle">Heavy-Duty Iron Reed on Floor</text>

  <rect x="640" y="305" width="200" height="55" fill="#334155" stroke="#c084fc" rx="5"/>
  <text x="740" y="330" fill="#d8b4fe" font-size="11" font-weight="bold" text-anchor="middle">Footfall Laser Counter</text>
  <text x="740" y="348" fill="#cbd5e1" font-size="9" text-anchor="middle">Customer Entry / Exit Analytics</text>

  <rect x="640" y="370" width="200" height="55" fill="#334155" stroke="#ef4444" rx="5"/>
  <text x="740" y="395" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle">110dB Store Siren</text>
  <text x="740" y="413" fill="#cbd5e1" font-size="9" text-anchor="middle">Instant Night Intrusion Alarm</text>

  <line x1="570" y1="180" x2="640" y2="180" stroke="#34d399" stroke-width="3"/>
  <line x1="570" y1="240" x2="640" y2="240" stroke="#f87171" stroke-width="3"/>
  <line x1="570" y1="300" x2="640" y2="300" stroke="#c084fc" stroke-width="3"/>
  <line x1="570" y1="360" x2="640" y2="360" stroke="#ef4444" stroke-width="3"/>

  <rect x="40" y="535" width="820" height="32" fill="#1e293b" rx="5"/>
  <text x="450" y="556" fill="#94a3b8" font-size="11" text-anchor="middle">Business ROI: Prevents spoiled inventory during blackouts + Automates heavy glow-signboards + Night security</text>
</svg>
