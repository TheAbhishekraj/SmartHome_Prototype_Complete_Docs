<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <rect width="850" height="520" fill="#0f172a" rx="10"/>
  <text x="425" y="35" fill="#f43f5e" font-size="18" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">SIMULATION 11 / NODE-F1/F4: DOORBELL, PANIC &amp; FALL ALARM</text>
  <text x="425" y="58" fill="#94a3b8" font-size="12" font-family="Arial, sans-serif" text-anchor="middle">Melodic Chime + Latching Emergency Panic Button + Fall Sensor + Master Disarm Reset</text>

  <!-- ESP32 Box -->
  <rect x="290" y="90" width="260" height="370" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" rx="8"/>
  <text x="420" y="120" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">ESP32 DevKit V1</text>
  
  <text x="305" y="170" fill="#38bdf8" font-size="12">GPIO13 (Doorbell SW)</text>
  <text x="305" y="230" fill="#f87171" font-size="12">GPIO14 (Panic Button)</text>
  <text x="305" y="290" fill="#facc15" font-size="12">GPIO27 (Fall Sensor)</text>
  <text x="305" y="350" fill="#4ade80" font-size="12">GPIO26 (Master Reset)</text>
  <text x="305" y="410" fill="#cbd5e1" font-size="12">GND (Common)</text>

  <text x="535" y="180" fill="#38bdf8" font-size="12" text-anchor="end">GPIO19 (Visitor LED)</text>
  <text x="535" y="250" fill="#ef4444" font-size="12" text-anchor="end">GPIO18 (Alarm Strobe)</text>
  <text x="535" y="320" fill="#f43f5e" font-size="12" text-anchor="end">GPIO23 (Chime / Siren)</text>

  <!-- Inputs Left -->
  <rect x="30" y="90" width="220" height="370" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="140" y="120" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">SAFETY INPUT SWITCHES</text>

  <rect x="45" y="145" width="190" height="50" fill="#334155" stroke="#38bdf8" rx="5"/>
  <text x="140" y="175" fill="#bae6fd" font-size="11" font-weight="bold" text-anchor="middle">Front Doorbell Button</text>

  <rect x="45" y="205" width="190" height="50" fill="#334155" stroke="#f87171" rx="5"/>
  <text x="140" y="235" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">Emergency Panic Button</text>

  <rect x="45" y="265" width="190" height="50" fill="#334155" stroke="#facc15" rx="5"/>
  <text x="140" y="295" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">Elder Fall / Impact Sensor</text>

  <rect x="45" y="325" width="190" height="50" fill="#334155" stroke="#4ade80" rx="5"/>
  <text x="140" y="355" fill="#bbf7d0" font-size="11" font-weight="bold" text-anchor="middle">Master Reset / Disarm</text>

  <line x1="235" y1="170" x2="290" y2="170" stroke="#38bdf8" stroke-width="3"/>
  <line x1="235" y1="230" x2="290" y2="230" stroke="#f87171" stroke-width="3"/>
  <line x1="235" y1="290" x2="290" y2="290" stroke="#facc15" stroke-width="3"/>
  <line x1="235" y1="350" x2="290" y2="350" stroke="#4ade80" stroke-width="3"/>

  <!-- Outputs Right -->
  <rect x="590" y="90" width="230" height="370" fill="#1e293b" stroke="#f43f5e" stroke-width="2" rx="8"/>
  <text x="705" y="120" fill="#fb7185" font-size="14" font-weight="bold" text-anchor="middle">ALARM &amp; CHIME ALERTS</text>

  <circle cx="705" cy="180" r="20" fill="#0284c7"/>
  <text x="705" y="185" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">CHIME</text>

  <circle cx="705" cy="255" r="20" fill="#dc2626"/>
  <text x="705" y="260" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">STROBE</text>

  <polygon points="685,310 725,290 725,350 685,330" fill="#e11d48"/>
  <text x="705" y="380" fill="#fda4af" font-size="11" font-weight="bold" text-anchor="middle">110dB Piezo Siren</text>

  <line x1="550" y1="180" x2="685" y2="180" stroke="#38bdf8" stroke-width="3"/>
  <line x1="550" y1="255" x2="685" y2="255" stroke="#ef4444" stroke-width="3"/>
  <line x1="550" y1="320" x2="685" y2="320" stroke="#f43f5e" stroke-width="3"/>

  <rect x="30" y="475" width="790" height="35" fill="#1e293b" rx="5"/>
  <text x="425" y="497" fill="#fda4af" font-size="11" font-weight="bold" text-anchor="middle">Priority: Panic button &amp; Fall sensors trigger immediate latching siren. Cleared ONLY by Reset switch.</text>
</svg>
