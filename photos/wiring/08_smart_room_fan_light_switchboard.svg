<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="600" fill="#0f172a" rx="12"/>
  
  <!-- Title Block -->
  <text x="450" y="40" fill="#38bdf8" font-size="20" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">NODE-D1: SMART ROOM LIGHT &amp; FAN RETROFIT SCHEMATIC</text>
  <text x="450" y="65" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif" text-anchor="middle">Indian Modular Switchboard Detached 2-Way Sync + Snubber Protection</text>

  <!-- High Voltage 230V Section (Left) -->
  <rect x="40" y="90" width="230" height="470" fill="#1e293b" stroke="#ef4444" stroke-width="2" rx="8" stroke-dasharray="6,6"/>
  <text x="155" y="115" fill="#f87171" font-size="14" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">MAINS 230V AC ZONE</text>

  <!-- Live & Neutral Busbars -->
  <line x1="70" y1="140" x2="70" y2="530" stroke="#dc2626" stroke-width="4"/>
  <text x="70" y="135" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">LIVE (L)</text>
  
  <line x1="120" y1="140" x2="120" y2="530" stroke="#2563eb" stroke-width="4"/>
  <text x="120" y="135" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">NEUTRAL (N)</text>

  <!-- SMPS Power Supply -->
  <rect x="150" y="160" width="100" height="70" fill="#334155" stroke="#38bdf8" stroke-width="2" rx="6"/>
  <text x="200" y="190" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Hi-Link 5V</text>
  <text x="200" y="210" fill="#94a3b8" font-size="10" text-anchor="middle">AC-DC SMPS</text>

  <!-- Relay 1 (Light) -->
  <rect x="150" y="260" width="100" height="70" fill="#334155" stroke="#eab308" stroke-width="2" rx="6"/>
  <text x="200" y="290" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">RELAY 1 (LIGHT)</text>
  <text x="200" y="310" fill="#94a3b8" font-size="10" text-anchor="middle">Songle 10A NO</text>

  <!-- Relay 2 (Fan + Snubber) -->
  <rect x="150" y="360" width="100" height="80" fill="#334155" stroke="#06b6d4" stroke-width="2" rx="6"/>
  <text x="200" y="385" fill="#67e8f9" font-size="11" font-weight="bold" text-anchor="middle">RELAY 2 (FAN)</text>
  <text x="200" y="405" fill="#94a3b8" font-size="10" text-anchor="middle">Songle 10A NO</text>
  <rect x="160" y="415" width="80" height="18" fill="#0f172a" stroke="#f59e0b" rx="3"/>
  <text x="200" y="428" fill="#fcd34d" font-size="9" text-anchor="middle">RC SNUBBER</text>

  <!-- Central ESP32 Controller Box -->
  <rect x="340" y="120" width="220" height="420" fill="#1e293b" stroke="#3b82f6" stroke-width="3" rx="10"/>
  <text x="450" y="150" fill="#60a5fa" font-size="16" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">ESP32-WROOM-32D</text>
  <text x="450" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">38-Pin Microcontroller</text>

  <!-- ESP32 Pins Labels Left -->
  <text x="355" y="210" fill="#cbd5e1" font-size="11">5V (VCC In)</text>
  <text x="355" y="240" fill="#cbd5e1" font-size="11">GND (Common)</text>
  <text x="355" y="295" fill="#fef08a" font-size="11">GPIO19 (Light Relay)</text>
  <text x="355" y="395" fill="#67e8f9" font-size="11">GPIO18 (Fan Relay)</text>

  <!-- ESP32 Pins Labels Right -->
  <text x="525" y="210" fill="#fb923c" font-size="11" text-anchor="end">GPIO25 (Wall SW 1)</text>
  <text x="525" y="270" fill="#60a5fa" font-size="11" text-anchor="end">GPIO26 (Wall SW 2)</text>
  <text x="525" y="330" fill="#4ade80" font-size="11" text-anchor="end">GPIO13 (PIR Sensor)</text>
  <text x="525" y="390" fill="#fbbf24" font-size="11" text-anchor="end">GPIO34 (LDR Lux In)</text>
  <text x="525" y="450" fill="#e879f9" font-size="11" text-anchor="end">GPIO23 (DHT22 Data)</text>

  <!-- Low Voltage Sensors & Switches Zone (Right) -->
  <rect x="620" y="90" width="240" height="470" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="740" y="115" fill="#34d399" font-size="14" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">SENSORS &amp; WALL INPUTS</text>

  <!-- Wall Switch 1 & 2 -->
  <rect x="645" y="180" width="190" height="45" fill="#334155" stroke="#fb923c" rx="5"/>
  <text x="740" y="200" fill="#fed7aa" font-size="11" font-weight="bold" text-anchor="middle">Wall Switch 1 (Light Dry Contact)</text>
  <text x="740" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Mechanical Rocker -> GND</text>

  <rect x="645" y="240" width="190" height="45" fill="#334155" stroke="#60a5fa" rx="5"/>
  <text x="740" y="260" fill="#bfdbfe" font-size="11" font-weight="bold" text-anchor="middle">Wall Switch 2 (Fan Dry Contact)</text>
  <text x="740" y="275" fill="#94a3b8" font-size="9" text-anchor="middle">Mechanical Rocker -> GND</text>

  <!-- PIR Motion -->
  <rect x="645" y="300" width="190" height="45" fill="#334155" stroke="#4ade80" rx="5"/>
  <text x="740" y="320" fill="#bbf7d0" font-size="11" font-weight="bold" text-anchor="middle">AM312 PIR Motion Sensor</text>
  <text x="740" y="335" fill="#94a3b8" font-size="9" text-anchor="middle">Discreet Switchboard Mount</text>

  <!-- LDR Lux -->
  <rect x="645" y="360" width="190" height="45" fill="#334155" stroke="#fbbf24" rx="5"/>
  <text x="740" y="380" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">LDR 5mm Lux Sensor</text>
  <text x="740" y="395" fill="#94a3b8" font-size="9" text-anchor="middle">Ambient Light Gating</text>

  <!-- DHT22 Climate -->
  <rect x="645" y="420" width="190" height="45" fill="#334155" stroke="#e879f9" rx="5"/>
  <text x="740" y="440" fill="#f5d0fe" font-size="11" font-weight="bold" text-anchor="middle">DHT22 Temperature &amp; Hum</text>
  <text x="740" y="455" fill="#94a3b8" font-size="9" text-anchor="middle">Comfort Adaptive Fan Trigger</text>

  <!-- Output Loads Top-Right -->
  <circle cx="200" cy="500" r="18" fill="#eab308"/>
  <text x="200" y="504" fill="#000" font-size="9" font-weight="bold" text-anchor="middle">LIGHT</text>
  <text x="200" y="530" fill="#fef08a" font-size="10" text-anchor="middle">To Ceiling Light</text>

  <!-- Fan Load -->
  <circle cx="100" cy="500" r="18" fill="#06b6d4"/>
  <text x="100" y="504" fill="#000" font-size="9" font-weight="bold" text-anchor="middle">FAN</text>
  <text x="100" y="530" fill="#67e8f9" font-size="10" text-anchor="middle">To Ceiling Fan</text>
</svg>
