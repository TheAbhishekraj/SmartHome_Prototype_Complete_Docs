<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="10"/>
  <text x="400" y="35" fill="#38bdf8" font-size="18" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">SIMULATION 10 / NODE-B1: INDOOR AIR QUALITY SCHEMATIC</text>
  <text x="400" y="58" fill="#94a3b8" font-size="12" font-family="Arial, sans-serif" text-anchor="middle">MQ-135 Gas Sensor + 3-Stage Air Status LEDs + Automated Exhaust Fan Purge</text>

  <!-- ESP32 Box -->
  <rect x="280" y="100" width="240" height="340" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" rx="8"/>
  <text x="400" y="130" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">ESP32 DevKit V1</text>
  
  <text x="295" y="180" fill="#f87171" font-size="12">5V Supply Out</text>
  <text x="295" y="240" fill="#cbd5e1" font-size="12">GND (Common)</text>
  <text x="295" y="300" fill="#fb923c" font-size="12">GPIO34 (MQ-135 AO)</text>
  <text x="505" y="180" fill="#06b6d4" font-size="12" text-anchor="end">GPIO19 (Exhaust Relay)</text>
  <text x="505" y="230" fill="#4ade80" font-size="12" text-anchor="end">GPIO18 (Air Good LED)</text>
  <text x="505" y="280" fill="#facc15" font-size="12" text-anchor="end">GPIO5 (Air Mod LED)</text>
  <text x="505" y="330" fill="#ef4444" font-size="12" text-anchor="end">GPIO17 (Air Bad LED)</text>
  <text x="505" y="380" fill="#f43f5e" font-size="12" text-anchor="end">GPIO23 (Hazard Buzzer)</text>

  <!-- MQ-135 Box Left -->
  <rect x="40" y="140" width="180" height="200" fill="#1e293b" stroke="#fb923c" stroke-width="2" rx="8"/>
  <text x="130" y="170" fill="#fdba74" font-size="14" font-weight="bold" text-anchor="middle">MQ-135 SENSOR</text>
  <text x="130" y="190" fill="#94a3b8" font-size="11" text-anchor="middle">CO2, VOC &amp; Smoke</text>
  <circle cx="130" cy="245" r="28" fill="#7c2d12" stroke="#ea580c" stroke-width="2"/>
  <text x="130" y="250" fill="#ffedd5" font-size="9" font-weight="bold" text-anchor="middle">MQ-135</text>
  <text x="205" y="300" fill="#fb923c" font-size="11" text-anchor="end">AO</text>

  <line x1="220" y1="300" x2="280" y2="300" stroke="#fb923c" stroke-width="3"/>

  <!-- Actuators Right -->
  <rect x="580" y="100" width="180" height="340" fill="#1e293b" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="670" y="130" fill="#67e8f9" font-size="14" font-weight="bold" text-anchor="middle">EXHAUST &amp; ALERTS</text>

  <circle cx="670" cy="180" r="18" fill="#0891b2"/>
  <text x="670" y="184" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">FAN</text>

  <circle cx="630" cy="240" r="12" fill="#16a34a"/>
  <text x="660" y="244" fill="#4ade80" font-size="10">Good</text>

  <circle cx="630" cy="285" r="12" fill="#ca8a04"/>
  <text x="660" y="289" fill="#facc15" font-size="10">Moderate</text>

  <circle cx="630" cy="330" r="12" fill="#dc2626"/>
  <text x="660" y="334" fill="#ef4444" font-size="10">Hazardous</text>

  <line x1="520" y1="180" x2="580" y2="180" stroke="#06b6d4" stroke-width="3"/>
  <line x1="520" y1="230" x2="580" y2="230" stroke="#4ade80" stroke-width="3"/>
  <line x1="520" y1="280" x2="580" y2="280" stroke="#facc15" stroke-width="3"/>
  <line x1="520" y1="330" x2="580" y2="330" stroke="#ef4444" stroke-width="3"/>

  <rect x="40" y="445" width="720" height="35" fill="#1e293b" rx="5"/>
  <text x="400" y="468" fill="#94a3b8" font-size="11" text-anchor="middle">Purge Logic: Auto Fan ON @ >600 PPM | Minimum 5-Minute Run Timer | OFF @ &lt;400 PPM</text>
</svg>
