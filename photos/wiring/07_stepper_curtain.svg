<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="10"/>
  <text x="400" y="35" fill="#38bdf8" font-size="18" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">SIMULATION 07 / NODE-D1: STEPPER CURTAIN SCHEMATIC</text>
  <text x="400" y="58" fill="#94a3b8" font-size="12" font-family="Arial, sans-serif" text-anchor="middle">ESP32 + A4988 Stepper Driver + 28BYJ-48 / NEMA-17 Motorized Curtains</text>

  <!-- ESP32 Box -->
  <rect x="240" y="100" width="240" height="340" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" rx="8"/>
  <text x="360" y="130" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">ESP32 DevKit V1</text>
  
  <text x="465" y="180" fill="#38bdf8" font-size="12" text-anchor="end">GPIO26 (STEP Pulse)</text>
  <text x="465" y="240" fill="#4ade80" font-size="12" text-anchor="end">GPIO27 (DIR Control)</text>
  <text x="465" y="300" fill="#f87171" font-size="12" text-anchor="end">GPIO25 (ENABLE)</text>
  <text x="465" y="360" fill="#cbd5e1" font-size="12" text-anchor="end">GND (Common)</text>

  <!-- A4988 Driver (Right) -->
  <rect x="540" y="120" width="220" height="280" fill="#1e293b" stroke="#a855f7" stroke-width="2" rx="8"/>
  <text x="650" y="150" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle">A4988 DRIVER</text>
  <text x="650" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">Microstepping Controller</text>
  
  <text x="555" y="180" fill="#38bdf8" font-size="11">STEP</text>
  <text x="555" y="240" fill="#4ade80" font-size="11">DIR</text>
  <text x="555" y="300" fill="#f87171" font-size="11">ENABLE</text>
  <text x="555" y="360" fill="#cbd5e1" font-size="11">GND</text>

  <text x="725" y="200" fill="#facc15" font-size="11" text-anchor="end">1A / 1B (Coil A)</text>
  <text x="725" y="260" fill="#facc15" font-size="11" text-anchor="end">2A / 2B (Coil B)</text>
  <text x="725" y="320" fill="#ef4444" font-size="11" text-anchor="end">VMOT (12V DC)</text>

  <line x1="480" y1="180" x2="540" y2="180" stroke="#38bdf8" stroke-width="3"/>
  <line x1="480" y1="240" x2="540" y2="240" stroke="#4ade80" stroke-width="3"/>
  <line x1="480" y1="300" x2="540" y2="300" stroke="#f87171" stroke-width="3"/>
  <line x1="480" y1="360" x2="540" y2="360" stroke="#64748b" stroke-width="3"/>

  <!-- Info Box Left -->
  <rect x="40" y="140" width="160" height="220" fill="#1e293b" stroke="#38bdf8" rx="8"/>
  <text x="120" y="170" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">CURTAIN MOTOR</text>
  <circle cx="120" cy="240" r="30" fill="#0369a1"/>
  <text x="120" y="245" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">NEMA-17</text>
  <text x="120" y="310" fill="#94a3b8" font-size="10" text-anchor="middle">1.8° Step Angle</text>
  <text x="120" y="330" fill="#94a3b8" font-size="10" text-anchor="middle">Belt Pulley Drive</text>

  <rect x="40" y="445" width="720" height="35" fill="#1e293b" rx="5"/>
  <text x="400" y="468" fill="#94a3b8" font-size="11" text-anchor="middle">Pin Map Authority: GPIO 26/27/25 prevents GPIO collisions with living room IR and Relay pins</text>
</svg>
