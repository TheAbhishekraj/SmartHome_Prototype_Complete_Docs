<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="10"/>
  <text x="400" y="35" fill="#38bdf8" font-size="18" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">SIMULATION 02: DHT22 CLIMATE &amp; FAN SCHEMATIC</text>
  <text x="400" y="58" fill="#94a3b8" font-size="12" font-family="Arial, sans-serif" text-anchor="middle">ESP32 + DHT22 Digital Sensor + Fan Relay with 1.5°C Hysteresis</text>

  <!-- ESP32 Box -->
  <rect x="280" y="100" width="240" height="340" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" rx="8"/>
  <text x="400" y="130" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">ESP32 DevKit V1</text>
  
  <text x="295" y="180" fill="#f87171" font-size="12">3V3 (VCC Out)</text>
  <text x="295" y="240" fill="#cbd5e1" font-size="12">GND (Common)</text>
  <text x="295" y="300" fill="#e879f9" font-size="12">GPIO21 (DHT22 Data)</text>
  <text x="505" y="300" fill="#06b6d4" font-size="12" text-anchor="end">GPIO19 (Fan Relay)</text>
  <text x="505" y="360" fill="#cbd5e1" font-size="12" text-anchor="end">GND (Common)</text>

  <!-- DHT22 Box (Left) -->
  <rect x="40" y="140" width="180" height="200" fill="#1e293b" stroke="#e879f9" stroke-width="2" rx="8"/>
  <text x="130" y="170" fill="#f0abfc" font-size="14" font-weight="bold" text-anchor="middle">DHT22 / AM2302</text>
  <text x="130" y="190" fill="#94a3b8" font-size="11" text-anchor="middle">Digital Temp &amp; Hum</text>
  <rect x="100" y="210" width="60" height="60" fill="#4a044e" stroke="#e879f9" rx="4"/>
  <text x="130" y="245" fill="#f5d0fe" font-size="10" font-weight="bold" text-anchor="middle">GRID</text>
  <text x="205" y="180" fill="#f87171" font-size="11" text-anchor="end">VCC</text>
  <text x="205" y="240" fill="#cbd5e1" font-size="11" text-anchor="end">GND</text>
  <text x="205" y="300" fill="#e879f9" font-size="11" text-anchor="end">SDA</text>

  <!-- Connections -->
  <line x1="220" y1="180" x2="280" y2="180" stroke="#ef4444" stroke-width="3"/>
  <line x1="220" y1="240" x2="280" y2="240" stroke="#64748b" stroke-width="3"/>
  <line x1="220" y1="300" x2="280" y2="300" stroke="#c084fc" stroke-width="3"/>

  <!-- Relay Box (Right) -->
  <rect x="580" y="140" width="180" height="220" fill="#1e293b" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="670" y="170" fill="#67e8f9" font-size="14" font-weight="bold" text-anchor="middle">FAN RELAY + SNUBBER</text>
  <text x="670" y="190" fill="#94a3b8" font-size="11" text-anchor="middle">Ceiling Fan Motor</text>
  <circle cx="670" cy="250" r="25" fill="#0891b2"/>
  <text x="670" y="255" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">FAN</text>
  <text x="595" y="300" fill="#06b6d4" font-size="11">IN / SIG</text>
  <text x="595" y="360" fill="#cbd5e1" font-size="11">GND</text>

  <line x1="520" y1="300" x2="580" y2="300" stroke="#06b6d4" stroke-width="3"/>
  <line x1="520" y1="360" x2="580" y2="360" stroke="#64748b" stroke-width="3"/>

  <rect x="40" y="445" width="720" height="35" fill="#1e293b" rx="5"/>
  <text x="400" y="468" fill="#94a3b8" font-size="11" text-anchor="middle">Hysteresis: Turn ON @ >28.0°C | Turn OFF @ &lt;26.5°C (Prevents rapid relay cycling)</text>
</svg>
