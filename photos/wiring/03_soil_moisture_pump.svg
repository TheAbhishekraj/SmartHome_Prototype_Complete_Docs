<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="10"/>
  <text x="400" y="35" fill="#38bdf8" font-size="18" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">SIMULATION 03 / NODE-A1: SOIL MOISTURE &amp; PUMP SCHEMATIC</text>
  <text x="400" y="58" fill="#94a3b8" font-size="12" font-family="Arial, sans-serif" text-anchor="middle">Capacitive Moisture Sensor + Contactor / Pump Relay with Anti-Flood Protection</text>

  <!-- ESP32 Box -->
  <rect x="280" y="100" width="240" height="340" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" rx="8"/>
  <text x="400" y="130" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">ESP32 DevKit V1</text>
  
  <text x="295" y="180" fill="#f87171" font-size="12">3V3 (VCC Out)</text>
  <text x="295" y="240" fill="#cbd5e1" font-size="12">GND (Common)</text>
  <text x="295" y="300" fill="#fb923c" font-size="12">GPIO34 (Soil Analog AO)</text>
  <text x="505" y="300" fill="#10b981" font-size="12" text-anchor="end">GPIO19 (Pump Relay)</text>
  <text x="505" y="360" fill="#cbd5e1" font-size="12" text-anchor="end">GND (Common)</text>

  <!-- Soil Sensor Box (Left) -->
  <rect x="40" y="140" width="180" height="200" fill="#1e293b" stroke="#fb923c" stroke-width="2" rx="8"/>
  <text x="130" y="170" fill="#fdba74" font-size="14" font-weight="bold" text-anchor="middle">SOIL SENSOR</text>
  <text x="130" y="190" fill="#94a3b8" font-size="11" text-anchor="middle">Capacitive V1.2 / Resistive</text>
  <polygon points="120,210 140,210 135,280 125,280" fill="#c2410c"/>
  <text x="130" y="250" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">PROBE</text>
  <text x="205" y="180" fill="#f87171" font-size="11" text-anchor="end">VCC</text>
  <text x="205" y="240" fill="#cbd5e1" font-size="11" text-anchor="end">GND</text>
  <text x="205" y="300" fill="#fb923c" font-size="11" text-anchor="end">AO</text>

  <line x1="220" y1="180" x2="280" y2="180" stroke="#ef4444" stroke-width="3"/>
  <line x1="220" y1="240" x2="280" y2="240" stroke="#64748b" stroke-width="3"/>
  <line x1="220" y1="300" x2="280" y2="300" stroke="#fb923c" stroke-width="3"/>

  <!-- Pump Box (Right) -->
  <rect x="580" y="140" width="180" height="220" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="670" y="170" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">GARDEN PUMP</text>
  <text x="670" y="190" fill="#94a3b8" font-size="11" text-anchor="middle">12V Solenoid / 230V Submersible</text>
  <circle cx="670" cy="250" r="25" fill="#059669"/>
  <text x="670" y="255" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">PUMP</text>
  <text x="595" y="300" fill="#34d399" font-size="11">IN / SIG</text>
  <text x="595" y="360" fill="#cbd5e1" font-size="11">GND</text>

  <line x1="520" y1="300" x2="580" y2="300" stroke="#10b981" stroke-width="3"/>
  <line x1="520" y1="360" x2="580" y2="360" stroke="#64748b" stroke-width="3"/>

  <rect x="40" y="445" width="720" height="35" fill="#1e293b" rx="5"/>
  <text x="400" y="468" fill="#94a3b8" font-size="11" text-anchor="middle">Anti-Flood: Max 20s Continuous Run Timer + 3-Hour Cooldown Cycle</text>
</svg>
