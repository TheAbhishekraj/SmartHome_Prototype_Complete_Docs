[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Build from the project root so sketch.ino stays beside diagram.json + wokwi.toml
src_dir = .
lib_deps =
  ; no extra libraries required for Simulation 01 (plain GPIO + Serial)

build_flags =
  ; helps the compiler warn on the tunable switches
  -D MOTION_TIMEOUT_MS=30000